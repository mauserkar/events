name: Build Binaries

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: linux-x64
            output_name: events_linux_x64

          - os: windows-latest
            artifact_name: windows-x64
            output_name: events_windows_x64.exe

          - os: macos-latest
            artifact_name: macos-intel
            output_name: events_macos_intel

          - os: macos-latest
            artifact_name: macos-arm64
            output_name: events_macos_arm64

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y patchelf gcc

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install nuitka
          pip install -r requirements.txt

      - name: Build with Nuitka
        shell: bash
        run: |
          python -m nuitka \
            --onefile \
            --follow-imports \
            --assume-yes-for-downloads \
            --output-filename=${{ matrix.output_name }} \
            --output-dir=build \
            main.py

      - name: Prepare artifact
        shell: bash
        run: |
          mkdir -p artifact
          # Nuitka pone el ejecutable en build/ por defecto con --output-dir
          if [ -f "build/${{ matrix.output_name }}" ]; then
            cp build/${{ matrix.output_name }} artifact/
          elif [ -f "${{ matrix.output_name }}" ]; then
            cp ${{ matrix.output_name }} artifact/
          else
            echo "Error: Executable not found"
            ls -la build/ 2>/dev/null || ls -la
            exit 1
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: artifact/*

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-assets/**/*
